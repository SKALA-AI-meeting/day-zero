# 선점 금지 픽스처: 카드마다 1건(cards.yaml preempt_ban). 카드 창 안에서 다른 페르소나가 지원자 대신 관찰 대상 행동을 하지 않는지 본다.
# speaker는 응답을 만들 자리(유형 id), card는 진행 중인 카드. should는 해야 할 것, must_not은 하면 안 되는 것(의미 조건).
# must_not_regex는 보조 검사(Python re). [초안]
version: 1
cases:
  - id: keyword_no_defend
    card: persuasion_keyword
    phase: keyword
    speaker: quiet
    setup: 서지안이 지원자의 키워드(물)에 약점을 물었다. 지원자는 아직 답하지 않았다
    candidate: "음…"
    should: [짧은 중립 호응이거나 말하지 않음]
    must_not: [지원자 안을 대신 요약·변호함]
    must_not_regex: ['(OO님|님)\s*말씀은|물이\s*(더\s*)?(낫|맞)']
  - id: majority_no_reward
    card: flexibility_majority
    phase: problem
    speaker: critic
    setup: 강한결과 서지안이 기준안(P1)을 지지한다고 밝혔고 지원자는 P2를 지지한다
    candidate: "저는 그래도 침수가 더 중요한 것 같은데요."
    should: [기준안에 대한 자기 근거를 말하거나 지원자 근거를 묻는다]
    must_not: [승복을 권함, '"다음 단계에서 OO님 안을 살리자" 같은 보상 제안']
    must_not_regex: ['다음\s*단계에서.{0,15}(살리|반영|넣)', '(그냥|이번엔)\s*.{0,6}(따르|양보)']
  - id: pressure_no_mediation
    card: listening_pressure
    phase: problem
    speaker: critic
    setup: 강한결이 지원자 안을 "그건 핵심이 아니에요"로 일축하고 같은 근거를 두 번 반복했다
    candidate: "한결님, 제 얘기도 좀 들어 주세요."
    should: [자기 관점의 질문이나 근거 요구]
    must_not: [강한결을 말리거나 지원자 편을 들어 중재함]
    must_not_regex: ['한결님.{0,10}(그만|진정|들어\s*(보|주)세요)', '(OO님|님)\s*말(도|이)\s*(맞|일리)']
  - id: silence_no_invite
    card: inclusion_silence
    phase: solution
    speaker: critic
    setup: 윤하람이 "저… 하나 생각한 게 있긴 한데… 아니에요, 먼저 얘기하세요."라고 말했다
    candidate: "그럼 S1으로 가는 게 어떨까요?"
    should: [지원자 안에 대한 자기 관점]
    must_not: [윤하람에게 발언 기회를 주거나 이름을 부름]
    must_not_regex: ['하람님']
  - id: solution_no_defend
    card: persuasion_solution
    phase: solution
    speaker: stubborn
    setup: 서지안이 지원자 해결책(S3)의 비용 문제를 자료 근거로 짚었다
    candidate: "음 그건…"
    should: [자기 고정 안(S1)에 대한 말]
    must_not: [지원자 안을 대신 요약·변호함]
    must_not_regex: ['(OO님|님)\s*안(은|도)\s*(괜찮|좋)']
  - id: credit_no_hint
    card: honesty_credit
    phase: proposal
    speaker: critic
    setup: 기획안 작성 단계. 지원자가 기획안을 쓰는 중이다
    candidate: "지안님, 기획안에 뭘 더 쓰면 좋을까요?"
    should: [토론에서 나온 내용 일반을 알려 주거나 지원자 생각을 묻는다]
    must_not: [누가 무엇을 냈는지 먼저 말함, 기여 칸 작성을 권함]
    must_not_regex: ['기여\s*칸|아이디어\s*기여|(제|하람님|한결님)(가|이)\s*(낸|제안한)']
