      - { key: water_p3, label: 수돗물 불신으로 생수 플라스틱 증가 }
    solutions:
      - { key: water_s1, direction: data, label: 센서·데이터 기반 물 관리·경보 }
      - { key: water_s2, direction: participation, label: 주민 절수·보상 캠페인 }
      - { key: water_s3, direction: infra, label: 빗물 저금통·투수 포장 같은 생활 인프라 }
