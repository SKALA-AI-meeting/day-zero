[project]
name = "dayzero-debate-mcp"
version = "0.1.0"
description = "Day Zero debate-mcp: 토론 상태 조회·메시지·안·입장·칸 채우기 도구(api 내부 엔드포인트 호출)"
requires-python = ">=3.12,<3.13"
# S6 동결 버전(docs/plan.md 3절 "agent-spike 결과")
dependencies = [
  "fastmcp==4.1.1",
  "mcp==2.3.0",
  "httpx>=0.27",
  "pydantic==2.14.1",
  "python-dotenv>=1.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실제 LLM 호출"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
