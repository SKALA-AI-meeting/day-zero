[project]
name = "dayzero-report-worker"
version = "0.1.0"
description = "Day Zero report-worker: 평가 에이전트(BARS)와 리포트 그래프, report.generate·report.approve 소비, 재시도·DLQ"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika>=9.4",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-openai>=0.2",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.2",
  "mcp==2.3.0",
  "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실제 LLM 호출"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
