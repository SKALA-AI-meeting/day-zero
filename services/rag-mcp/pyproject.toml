[project]
name = "dayzero-rag-mcp"
version = "0.1.0"
description = "Day Zero rag-mcp: 키워드별 참고 자료 검색·조회·색인(pgvector)"
requires-python = ">=3.12,<3.13"
# S6 동결 버전(docs/plan.md 3절 "agent-spike 결과")
dependencies = [
  "fastmcp==4.1.1",
  "mcp==2.3.0",
  "httpx>=0.27",
  "pydantic==2.14.1",
  "asyncpg>=0.29",
  "pyyaml>=6.0",
  "pgvector>=0.3",
  "python-dotenv>=1.0",
  "sentence-transformers>=3.0",
  "torch>=2.4",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.uv]
package = false

# 컨테이너(linux)는 CUDA 없는 CPU 휠을 쓴다. macOS는 PyPI 기본 휠.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실제 모델(BGE-M3) 사용"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
